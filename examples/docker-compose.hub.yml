services:
  bifrost-hub:
    image: ghcr.io/zurdi15/bifrost-hub:latest
    container_name: bifrost-hub
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # openssl rand -hex 32
      BIFROST_ENROLL_TOKEN: change-me
      # false → new agents wait as 'pending' until approved in the UI
      BIFROST_AUTO_APPROVE: "true"
    volumes:
      - ./data:/data
      # Declarative bookmarks: with /data bind-mounted like above, just drop
      # a bookmarks.yml (or .yaml) into ./data — no extra mount needed (see
      # examples/bookmarks.yml). Only mount the file separately when /data is
      # a named volume, and create it on the host FIRST (otherwise Docker
      # makes a directory in its place):
      #- ./bookmarks.yml:/data/bookmarks.yml:ro
