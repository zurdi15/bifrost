<svg xmlns="http://www.w3.org/2000/svg" viewBox="-14 -14 574 128">
<!-- BIFROST, carved: each letterform leans on its Elder Futhark ancestor
     (B~berkano, I~isa, F~fehu, R~raido, O~ingwaz, S~sowilo, T~tiwaz) while
     staying readable as Latin. Stroke-drawn, aurora gradient, no curves —
     runes are cut, not penned. -->
<defs>
  <linearGradient id="aurora" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="546" y2="0">
    <stop offset="0.00" stop-color="#34d399"/>
    <stop offset="0.20" stop-color="#2dd4bf"/>
    <stop offset="0.40" stop-color="#22d3ee"/>
    <stop offset="0.60" stop-color="#60a5fa"/>
    <stop offset="0.80" stop-color="#a78bfa"/>
    <stop offset="1.00" stop-color="#f472b6"/>
  </linearGradient>
</defs>
<g fill="none" stroke="url(#aurora)" stroke-width="12" stroke-linecap="square" stroke-linejoin="miter">
  <!-- B : berkano ᛒ -->
  <path d="M0 0 V100 M0 4 L46 27 L2 50 L46 74 L0 97"/>
  <!-- I : isa ᛁ -->
  <path d="M88 0 V100"/>
  <!-- F : fehu ᚠ -->
  <path d="M132 0 V100 M132 24 L178 2 M132 54 L178 32"/>
  <!-- R : raido ᚱ -->
  <path d="M220 0 V100 M220 4 L266 26 L222 48 L266 100"/>
  <!-- O : ingwaz ᛜ -->
  <path d="M338 2 L368 50 L338 98 L308 50 Z"/>
  <!-- S : sowilo ᛋ -->
  <path d="M442 0 L400 38 L442 62 L400 100"/>
  <!-- T : tiwaz ᛏ -->
  <path d="M514 2 V100 M514 4 L484 28 M514 4 L544 28"/>
</g>
</svg>
