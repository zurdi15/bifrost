version: 0.1
cli:
  version: 1.25.0
plugins:
  sources:
    - id: trunk
      ref: v1.7.2
      uri: https://github.com/trunk-io/plugins
runtimes:
  enabled:
    - go@1.23.4
    - node@22.16.0
    - python@3.12.2
lint:
  enabled:
    - ruff@0.14.13
    - gofmt@1.20.4
    - golangci-lint2@2.6.2
    - eslint@9.39.2
    - prettier@3.8.0
    - hadolint@2.14.0
    - shellcheck@0.11.0
    - shfmt@3.6.0
    - yamllint@1.38.0
    - markdownlint@0.45.0
    - taplo@0.10.0
    - trufflehog@3.93.0
    - osv-scanner@2.3.0
    - checkov@3.2.494
  ignore:
    - linters: [ALL]
      paths:
        - frontend/src/styles/tokens.css
        - hub/alembic/versions/**
actions:
  enabled:
    - trunk-fmt-pre-commit
    - trunk-check-pre-push
